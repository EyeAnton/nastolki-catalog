name: Auto-add game listing

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Game title (exact)'
        required: true
      price:
        description: 'Price in AMD (integer)'
        required: false
      lang:
        description: 'Language: ENG or РУС'
        default: 'ENG'
      msg_id:
        description: 'Telegram message ID'
        required: true
      seller:
        description: 'Seller Telegram username'
        required: false
        default: ''
      note:
        description: 'Seller note / extras'
        required: false
        default: ''
      exchange:
        description: 'Available for exchange? true/false'
        default: 'false'

jobs:
  add-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      # Входные данные — через env, а не подстановкой ${{ }} в скрипт:
      # кавычка или $( ) в названии/примечании не выполнится как команда.
      - name: Run auto_add.py
        env:
          IN_TITLE: ${{ github.event.inputs.title }}
          IN_PRICE: ${{ github.event.inputs.price || '0' }}
          IN_LANG: ${{ github.event.inputs.lang }}
          IN_MSG_ID: ${{ github.event.inputs.msg_id }}
          IN_SELLER: ${{ github.event.inputs.seller }}
          IN_NOTE: ${{ github.event.inputs.note }}
          IN_EXCHANGE: ${{ github.event.inputs.exchange }}
        run: |
          EXTRA=""
          if [ "$IN_EXCHANGE" = "true" ]; then EXTRA="--exchange"; fi
          python auto_add.py \
            --title "$IN_TITLE" \
            --price "$IN_PRICE" \
            --lang "$IN_LANG" \
            --msg_id "$IN_MSG_ID" \
            --seller "$IN_SELLER" \
            --note "$IN_NOTE" \
            $EXTRA

      - name: Check catalog data
        run: python -m unittest discover -s tests

      - name: Commit changes
        env:
          IN_TITLE: ${{ github.event.inputs.title }}
        run: |
          git config user.name "boardex-bot"
          git config user.email "bot@boardex.am"
          git add index.html covers/
          git diff --staged --quiet || git commit -m "Auto: add/update listing — $IN_TITLE"
          git push

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build dist
        run: |
          rm -rf dist && mkdir dist
          cp index.html dist/
          cp -r covers dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler pages deploy dist/ \
            --project-name nastolki-catalog \
            --branch main \
            --commit-dirty=true
