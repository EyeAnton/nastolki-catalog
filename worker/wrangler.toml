name = "nastolki-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Правки листингов продавцов (ключ "seller:<ник>")
[[kv_namespaces]]
binding = "OVERRIDES"
id = "d677a80744b14cf1a12147e2ace55da9"

# Секреты — через `npx wrangler secret put <ИМЯ>` (значения не в репо):
#   EDIT_KEY            — админский ключ (правка любых продавцов, уборка картинок)
#   TG_LOGIN_BOT_TOKEN  — токен бота для Telegram Login Widget (вход владельцев листингов)
#   SESSION_SECRET      — случайная строка для подписи токенов сессии (например `openssl rand -hex 32`)
